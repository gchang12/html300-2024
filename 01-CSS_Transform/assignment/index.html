<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <title>Document</title>
  <script defer src="scripts/script.js"></script>
</head>
<body>
  <main class="main">
    <!-- https://codepen.io/vajkri/pen/PrBQxg -->
    <h1 class="page-title">Receipt with 3D fold effect</h1>
    <!-- Folded receipt body -->
    <article class="receipt">
      <!-- Upper half of receipt, containing prices and date of purchase -->
      <section class="receipt__half upper">
        <p>Receipt</p>
        <h1>$59.98</h1>
        <p class="sm">04.06.2019 - 09:47</p>
        <div class="receipt__content">
          <!-- Table containing prices and items -->
          <table>
            <tbody>
              <!-- First row of table, containing price and item -->
              <tr>
                <td>Faded jeans</td>
                <td>$39.99</td>
              </tr>
              <tr>
                <td>Sleeveless shirt</td>
                <td>$19.99</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <!-- Lower half of receipt, to be folded up; text-content to be changed upon click -->
      <section class="receipt__half lower">
        <button>More info</button>
      </section>
    </article>
  </main>
</body>
</html>
